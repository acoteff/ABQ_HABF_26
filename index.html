<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molly & Aaron Go To New Mexico</title>
<meta name="description" content="A photo journal of our trip to Albuquerque Hot Air Balloon Fiesta.">
<style>
  :root {
    --bg: #faf8f5;
    --text: #2b2a28;
    --muted: #6f6b66;
    --accent: #b5532b;
    --rule: #e4dfd8;
    --max: 720px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --text: #ece8e2;
      --muted: #a09b94;
      --accent: #e08a5f;
      --rule: #34322f;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.7 Georgia, "Times New Roman", serif;
  }
  img, video { max-width: 100%; display: block; }
  a { color: var(--accent); }

  /* Hero */
  header.hero {
    position: relative;
    min-height: 60vh;
    display: flex;
    align-items: flex-end;
    color: #fff;
    background: #444 url("images/270.jpeg") center / cover no-repeat;
  }
  header.hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,.05) 70%);
  }
  .hero-inner {
    position: relative; z-index: 1;
    width: 100%; max-width: var(--max);
    margin: 0 auto; padding: 0 20px 40px;
  }
  .hero h1 { margin: 0 0 6px; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.1; }
  .hero p { margin: 0; font-family: system-ui, sans-serif; font-size: .95rem; opacity: .9; }

  main { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
  .intro { max-width: var(--max); margin: 32px auto; font-size: 1.1rem; }

  nav.jump {
    max-width: var(--max); margin: 0 auto;
    font-family: system-ui, sans-serif; font-size: .9rem;
    padding: 18px 0; border-bottom: 1px solid var(--rule);
    display: flex; gap: 16px;
  }

  h2 { margin: 48px 0 6px; font-size: 1.7rem; line-height: 1.25; }
  .count { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: 0 0 18px; }

  /* Photo grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 6px;
  }
  .grid button {
    padding: 0; border: 0; background: var(--rule);
    cursor: zoom-in; border-radius: 4px; overflow: hidden;
    aspect-ratio: 1;
  }
  .grid img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .2s;
  }
  .grid button:hover img, .grid button:focus-visible img { transform: scale(1.04); }

  /* Videos */
  .videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .videos video { width: 100%; border-radius: 6px; background: #000; }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 90vh; object-fit: contain; }
  #lightbox button {
    position: absolute; background: none; border: 0; color: #fff;
    font: 2.2rem/1 system-ui, sans-serif; cursor: pointer; padding: 16px;
    opacity: .8;
  }
  #lightbox button:hover { opacity: 1; }
  #lb-close { top: 0; right: 0; }
  #lb-prev  { left: 0; top: 50%; transform: translateY(-50%); }
  #lb-next  { right: 0; top: 50%; transform: translateY(-50%); }

  footer {
    max-width: var(--max); margin: 0 auto; padding: 0 20px 48px;
    font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted);
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>Albuquerque Hot Air Balloon Fiesta 2026</h1>
    <p>October 2026</p>
  </div>
</header>

<nav class="jump" aria-label="Jump to a section">
  <a href="#photos">Photos</a>
  <a href="#videos" id="videos-link">Videos</a>
</nav>

<main>

  <p class="intro">
    A short paragraph about the trip: where you went, who came along, and what made it memorable.
    Replace this text with your own.
  </p>

  <h2 id="photos">Photos</h2>
  <p class="count" id="photo-count"></p>
  <div class="grid" id="photo-grid"></div>

  <h2 id="videos">Videos</h2>
  <div class="videos" id="video-grid"></div>

</main>

<footer>
  Thanks for following along.
</footer>

<div id="lightbox" role="dialog" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">&times;</button>
  <button id="lb-prev" aria-label="Previous photo">&#8249;</button>
  <img id="lb-img" alt="">
  <button id="lb-next" aria-label="Next photo">&#8250;</button>
</div>

<!-- media.js defines PHOTOS and VIDEOS (lists of file names). See instructions to generate it. -->
<script src="media.js"></script>
<script>
  const photos = (typeof PHOTOS !== "undefined") ? PHOTOS : [];
  const videos = (typeof VIDEOS !== "undefined") ? VIDEOS : [];

  // ---- Photo grid ----
  const grid = document.getElementById("photo-grid");
  document.getElementById("photo-count").textContent =
    photos.length ? photos.length + " photos. Tap any photo to enlarge." : "";

  photos.forEach((name, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", "Open photo " + (i + 1));
    const img = document.createElement("img");
    img.src = "images/" + name;
    img.alt = "Trip photo " + (i + 1);
    img.loading = "lazy";
    img.decoding = "async";
    btn.appendChild(img);
    btn.addEventListener("click", () => openAt(i));
    grid.appendChild(btn);
  });

  // ---- Videos ----
  const vgrid = document.getElementById("video-grid");
  if (!videos.length) {
    document.getElementById("videos").remove();
    vgrid.remove();
    document.getElementById("videos-link").remove();
  }
  videos.forEach(name => {
    const v = document.createElement("video");
    v.controls = true;
    v.preload = "metadata";
    v.playsInline = true;
    v.src = "videos/" + name;
    vgrid.appendChild(v);
  });

  // ---- Lightbox ----
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  let current = 0;

  function show(i) {
    current = (i + photos.length) % photos.length;
    lbImg.src = "images/" + photos[current];
  }
  function openAt(i) { show(i); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeLb() { lb.classList.remove("open"); lbImg.src = ""; document.body.style.overflow = ""; }

  document.getElementById("lb-close").onclick = closeLb;
  document.getElementById("lb-prev").onclick = () => show(current - 1);
  document.getElementById("lb-next").onclick = () => show(current + 1);
  lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });
</script>

</body>
</html>
